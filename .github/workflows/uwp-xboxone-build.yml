name: UWP Xbox One Build

on:
  push:
    branches:
      - UWP-Port
  pull_request:
    branches:
      - UWP-Port

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSVC and Windows SDK
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Ninja
      run: |
        python -m pip install --upgrade pip
        pip install ninja

    - name: Check for required tools
      run: |
        where python
        where ninja
        echo "Checking for PowerShell..."
        where pwsh

    - name: Configure Guest
      run: |
        python configure.py --release
        ninja uwp_guest

    - name: Configure and Build Host (Debug)
      if: ${{ matrix.configuration == 'Debug' }}
      run: |
        # Use the build script with debug configuration
        Write-Output "Building Debug configuration"
        .\tools\build.ps1 -Configuration Debug -UwpDeps "C:\bsuwp\_deps\uwpdep-src"

    - name: Configure and Build Host (Release)
      if: ${{ matrix.configuration == 'Release' }}
      run: |
        # Use the build script with release configuration
        Write-Output "Building Release configuration"
        .\tools\build.ps1 -Configuration Release -UwpDeps "C:\bsuwp\_deps\uwpdep-src"

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Warthog-Xbox-One-${{ matrix.configuration }}
        path: build\xbox-uwp\*.appx
        if-no-files-found: error